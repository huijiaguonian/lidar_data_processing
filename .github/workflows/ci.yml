name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core package and tests
        run: python -m pip install -e ".[dev]"
      - name: Run parser regression tests
        run: python -m pytest
      - name: Compile maintained Python sources
        run: python -m compileall -q src examples scripts
